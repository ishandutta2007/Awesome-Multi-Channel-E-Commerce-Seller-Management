<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .tag-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    
    /* Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes orbitDot {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }

    .anim-glow1 {
      transform-origin: 200px 100px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .anim-glow2 {
      transform-origin: 1000px 300px;
      animation: pulseGlow 10s ease-in-out infinite alternate;
    }
    .anim-flow {
      stroke-dasharray: 12 12;
      animation: flowLine 14s linear infinite;
    }
    .anim-pill1 {
      animation: floatPill1 6s ease-in-out infinite;
    }
    .anim-pill2 {
      animation: floatPill2 7s ease-in-out infinite 1s;
    }
    .anim-pill3 {
      animation: floatPill3 5.5s ease-in-out infinite 0.5s;
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Decorative Glowing Orbs (Deep in background) -->
  <g opacity="0.6">
    <circle cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#softGlow)" class="anim-glow1" />
    <circle cx="1020" cy="310" r="160" fill="#a855f7" filter="url(#softGlow)" class="anim-glow2" />
    <circle cx="600" cy="210" r="180" fill="#6366f1" filter="url(#softGlow)" opacity="0.15" />
  </g>

  <!-- High-Tech Ambient Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" />
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420" />
  </g>

  <!-- Dynamic Ambient Flow Wave Lines (Positioned behind content) -->
  <g fill="none" opacity="0.45">
    <path d="M -50,330 C 250,390 400,290 650,340 C 900,390 1050,310 1250,350" stroke="#38bdf8" stroke-width="2.5" class="anim-flow" />
    <path d="M -50,350 C 220,290 450,380 720,310 C 950,260 1100,360 1250,310" stroke="#a855f7" stroke-width="2" class="anim-flow" style="animation-direction: reverse; animation-duration: 18s;" />
  </g>

  <!-- Dynamic Floating Feature Pills (Right and Center-Bottom Accent) -->
  <g class="anim-pill1">
    <!-- Channel Hub Pill -->
    <g transform="translate(860, 55)">
      <rect width="250" height="48" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="28" cy="24" r="10" fill="#38bdf8" opacity="0.2" />
      <circle cx="28" cy="24" r="5" fill="#38bdf8" />
      <text x="50" y="29" class="badge-text">⚡ Real-Time Inventory Sync</text>
    </g>
  </g>

  <g class="anim-pill2">
    <!-- Multi-Marketplace Hub Pill -->
    <g transform="translate(890, 125)">
      <rect width="230" height="48" rx="24" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" opacity="0.95" />
      <circle cx="28" cy="24" r="10" fill="#6366f1" opacity="0.2" />
      <circle cx="28" cy="24" r="5" fill="#818cf8" />
      <text x="50" y="29" class="badge-text">🛒 Multi-Marketplace Hub</text>
    </g>
  </g>

  <g class="anim-pill3">
    <!-- AI-Agent Automation Pill -->
    <g transform="translate(840, 195)">
      <rect width="260" height="48" rx="24" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
      <circle cx="28" cy="24" r="10" fill="#a855f7" opacity="0.2" />
      <circle cx="28" cy="24" r="5" fill="#c084fc" />
      <text x="50" y="29" class="badge-text">🤖 AI Agents &amp; MCP Workflows</text>
    </g>
  </g>

  <!-- FOREGROUND: Content Header, Title & Badges (Sharp and fully readable) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag / Eyebrow -->
    <g transform="translate(0, 75)">
      <rect width="290" height="28" rx="14" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="30" y="18" class="tag-title">Omnichannel E-Commerce Suite</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 145)">
      <text class="title-text">
        Multi-Channel E-Commerce
      </text>
      <text y="50" class="title-text" fill="url(#primaryGrad)">
        Seller Management
      </text>
    </g>

    <!-- Subtitle / Meta Description -->
    <g transform="translate(0, 240)">
      <text class="subtitle-text">
        Curated enterprise SaaS &amp; open-source platforms for unified inventory,
      </text>
      <text y="26" class="subtitle-text">
        order routing, catalog synchronization, and marketplace listing operations.
      </text>
    </g>

    <!-- Marketplace / Channel Feature Tags -->
    <g transform="translate(0, 315)">
      <!-- Channel 1: Amazon -->
      <rect x="0" y="0" width="112" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" class="badge-text" fill="#cbd5e1">📦 Amazon</text>

      <!-- Channel 2: Shopify -->
      <rect x="124" y="0" width="112" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="140" y="22" class="badge-text" fill="#cbd5e1">🛍️ Shopify</text>

      <!-- Channel 3: eBay -->
      <rect x="248" y="0" width="100" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="264" y="22" class="badge-text" fill="#cbd5e1">🏷️ eBay</text>

      <!-- Channel 4: Walmart -->
      <rect x="360" y="0" width="112" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="376" y="22" class="badge-text" fill="#cbd5e1">✨ Walmart</text>

      <!-- Channel 5: TikTok Shop -->
      <rect x="484" y="0" width="136" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="498" y="22" class="badge-text" fill="#cbd5e1">📱 TikTok Shop</text>
    </g>
  </g>
</svg>
